<body>

<div id="main">
	<div style="float:left; width: 20%;">

		</ul>		
	</div>
	<div id="main-wrap-post" style="float:right; width:79%;">
			<script>
				var value = "home";
				function callPost(post){
					if(post != null){
						value = post;
					}else{
						value = "home";
					}
				$("#main-wrap-post").load("posts/"+value+".html", function(response, status, xhr) {
				
				if (status == "error") {
					var msg = "Servidor feio! Você não pode fazer isso!: ";
					$("#main-wrap-post").html(msg + xhr.status + " " + xhr.statusText);
					}
				});
				}			
			</script>
	</div>
<!-- main ends here -->
